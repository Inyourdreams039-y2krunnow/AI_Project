<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Project Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --text-main: #f8fafc;
            --accent-color: #6366f1;
            --user-bubble: #312e81;
            --ai-bubble: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background-color: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 16px;
            word-wrap: break-word;
        }

        .message pre {
            background-color: #090d16;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
        }

        .message code {
            font-family: 'Courier New', Courier, monospace;
            background-color: rgba(0,0,0,0.2);
            padding: 2px 4px;
            border-radius: 4px;
        }

        .user-message {
            background-color: var(--user-bubble);
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .ai-message {
            background-color: var(--ai-bubble);
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }

        #input-area {
            display: flex;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.2);
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #334155;
            color: white;
            font-size: 16px;
        }

        #user-input:focus {
            outline: 2px solid var(--accent-color);
        }

        #send-btn {
            padding: 12px 24px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background-color: #4f46e5;
        }

        /* Typing Indicator Styles */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            background-color: var(--ai-bubble);
            align-self: flex-start;
            border-radius: 8px;
            align-items: center;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 10px; transition: all 0.3s ease;">Y2K AI ENGINE</h2>

    <div id="chat-container">
        <div id="chat-box">
            <div class="message ai-message">System Online. Welcome back, Creator. How can I assist you today?</div>
        </div>
        
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type your instruction here..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const pageTitle = document.querySelector('h2'); 

        // Generate a random unique ID for this browser tab instance to handle context isolation
        const userId = 'session-' + Math.random().toString(36).substr(2, 9);

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Render User Message bubble
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = text;
            chatBox.appendChild(userDiv);
            
            userInput.value = '';
            scrollToBottom();

            // Inject the animated Typing Indicator
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.id = 'typing-loader';
            indicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            chatBox.appendChild(indicator);
            scrollToBottom();

            try {
                // Post command to your live Render backend endpoint
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, userId: userId })
                });

                const data = await response.json();
                
                // Remove typing loader
                document.getElementById('typing-loader').remove();

                // If the creator successfully unlocked the terminal, upgrade the title screen!
                if (data.reply.includes("CORE OVERRIDES ACTIVATED")) {
                    pageTitle.textContent = "⚡ Y2K CREATOR PROTOCOL";
                    pageTitle.style.color = "#6366f1";
                }

                // Render AI Response bubble using marked parsing library
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-message';
                aiDiv.innerHTML = marked.parse(data.reply || "No data received.");
                chatBox.appendChild(aiDiv);

            } catch (error) {
                console.error("Communication error:", error);
                document.getElementById('typing-loader').remove();
                
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message ai-message';
                errorDiv.style.color = '#ef4444';
                errorDiv.textContent = "Error: Could not connect to the neural server engine.";
                chatBox.appendChild(errorDiv);
            }

            scrollToBottom();
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
