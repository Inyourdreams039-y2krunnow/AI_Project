<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Y2K INC - MAINFRAME</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background: #333; color: white; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; overflow: hidden; }
        #sidebar { width: 260px; background: #222; border-right: 1px solid #ff7700; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .btn-sidebar { background: #ff7700; color: black; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 8px; }
        .btn-sidebar.secondary { background: transparent; color: #888; border: 1px solid #444; margin-top: 10px; font-size: 13px; }
        #main { flex: 1; display: flex; flex-direction: column; background: #333; }
        #chat-container { flex: 1; overflow-y: auto; padding: 40px 15%; display: flex; flex-direction: column; }
        .message { margin-bottom: 25px; padding: 18px; border-radius: 18px; max-width: 85%; }
        .user { background: #4a4a4a; align-self: flex-end; border-bottom-right-radius: 4px; }
        .bot { background: #1a1a1a; border-left: 4px solid #ff7700; align-self: flex-start; border-bottom-left-radius: 4px; }
        #input-wrapper { width: 100%; padding: 20px 0 40px 0; display: flex; flex-direction: column; align-items: center; }
        #input-area { width: 85%; max-width: 800px; background: #222; border-radius: 28px; padding: 10px 18px; display: flex; align-items: flex-end; gap: 12px; border: 1px solid #444; }
        textarea { flex: 1; background: transparent; color: white; border: none; outline: none; resize: none; font-size: 16px; padding: 10px 0; }
        .icon-btn { background: transparent; border: none; color: #888; cursor: pointer; font-size: 22px; padding: 8px; border-radius: 50%; }
        .icon-btn.active { color: #ff7700; }
        #thinking { color: #ff7700; font-size: 14px; margin-bottom: 8px; display: none; }
        #preview-img { max-height: 80px; border-radius: 12px; margin-bottom: 12px; display: none; border: 2px solid #ff7700; }
        #settings-modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#222; border: 2px solid #ff7700; padding: 30px; border-radius: 15px; z-index: 1000; width: 320px; }
        #overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:999; }
    </style>
</head>
<body>

<div id="sidebar">
    <h1 style="color: #ff7700;">Y2K INC</h1>
    <button class="btn-sidebar" onclick="clearChat()">+ NEW CHAT</button>
    <div style="margin-top: auto;">
        <button class="btn-sidebar secondary" onclick="toggleSettings()">⚙️ SETTINGS</button>
        <button class="btn-sidebar secondary" onclick="window.location.reload()">🔄 REBOOT</button>
    </div>
</div>

<div id="settings-modal">
    <h3 style="color:#ff7700; margin-top:0;">MAINFRAME CONFIG</h3>
    <label style="color:#888; font-size:12px;">AI PERSONALITY STYLE:</label>
    <input type="text" id="persona-input" placeholder="e.g. Chill, Witty, Sarcastic..." 
           style="width:95%; padding:10px; background:#444; color:white; border:none; border-radius:5px; margin-bottom:20px;">
    <button class="btn-sidebar" onclick="saveSettings()" style="width:100%;">APPLY</button>
</div>
<div id="overlay" onclick="toggleSettings()"></div>

<div id="main">
    <div id="chat-container"></div>
    <div id="input-wrapper">
        <img id="preview-img" src="">
        <div id="thinking">Y2K is thinking...</div>
        <div id="input-area">
            <input type="file" id="file-input" hidden accept="image/*" onchange="handleImage(this)">
            <button class="icon-btn" onclick="document.getElementById('file-input').click()">🖼️</button>
            <button id="voice-btn" class="icon-btn" onclick="toggleVoice()">🎤</button>
            <textarea id="user-input" rows="1" placeholder="Type a message..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>
            <button class="icon-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const thinking = document.getElementById('thinking');
    const previewImg = document.getElementById('preview-img');
    const voiceBtn = document.getElementById('voice-btn');
    let currentImageData = null;
    let voiceMode = false;
    let currentPersona = "sharp, witty, and casual";

    function autoResize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
    function handleKeyDown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
    function toggleSettings() {
        const m = document.getElementById('settings-modal');
        const isShow = m.style.display === 'none' || m.style.display === '';
        m.style.display = isShow ? 'block' : 'none';
        document.getElementById('overlay').style.display = isShow ? 'block' : 'none';
    }
    function saveSettings() {
        const input = document.getElementById('persona-input').value;
        if (input.trim()) currentPersona = input;
        toggleSettings();
    }
    function handleImage(input) {
        const reader = new FileReader();
        reader.onload = (e) => { currentImageData = e.target.result; previewImg.src = currentImageData; previewImg.style.display = 'block'; };
        reader.readAsDataURL(input.files[0]);
    }

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.onresult = (e) => { if (e.results[0][0].transcript.length > 2) { userInput.value = e.results[0][0].transcript; sendMessage(); } };
    recognition.onend = () => { if (voiceMode) recognition.start(); };

    function toggleVoice() { 
        voiceMode = !voiceMode; 
        voiceBtn.classList.toggle('active', voiceMode); 
        if (!voiceMode) window.speechSynthesis.cancel(); 
        else recognition.start();
    }

    function speak(text) { 
        if (voiceMode) { 
            window.speechSynthesis.cancel();
            const m = new SpeechSynthesisUtterance(text); 
            m.rate = 1.2; m.pitch = 0.9;
            const voices = window.speechSynthesis.getVoices();
            const bestVoice = voices.find(v => v.name.includes('Google US English')) || voices[0];
            m.voice = bestVoice;
            window.speechSynthesis.speak(m); 
        } 
    }

    window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message && !currentImageData) return;
        appendMessage('user', message);
        userInput.value = ''; thinking.style.display = 'block'; previewImg.style.display = 'none';

        const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, image: currentImageData, persona: currentPersona })
        });
        const data = await response.json();
        thinking.style.display = 'none';
        appendMessage('bot', data.reply);
        speak(data.reply);
    }

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.innerHTML = role === 'bot' ? marked.parse(text) : text;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }
    async function clearChat() { await fetch('/clear', { method: 'POST' }); chatContainer.innerHTML = ''; }
</script>
</body>
</html>
